<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Administración del comercio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <!--
      Estructura estática (SC-009): se pinta con el HTML, antes de que llegue y corra el código, y
      Angular la reemplaza al arrancar. Tiene la forma del marco —encabezado de dos filas y renglones—
      para que el cambio no se note. Estilos acá adentro: la hoja de estilos todavía no llegó, así que no
      pueden usar var(--ds-*). Cada valor es una copia del token que representa, en cada esquema, y
      apps/admin/design-system/boot.spec.ts verifica que siga siéndolo (research §4 de la 003).
    -->
    <style>
      body {
        margin: 0;
        background: #f6f7ff;
      }
      .boot {
        max-width: 1200px;
        margin-inline: auto;
        padding: 16px;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        color: #666666;
      }
      .boot-header {
        display: flex;
        align-items: center;
        height: 96px;
        margin-bottom: 16px;
        font-size: 0.875rem;
      }
      .boot-row {
        height: 72px;
        margin-bottom: 8px;
        border-radius: 8px;
        background: rgba(0, 0, 0, 0.04);
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #13131a;
        }
        .boot {
          color: #b6b6b6;
        }
        .boot-row {
          background: rgba(255, 255, 255, 0.06);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .boot-row {
          animation: boot-pulse 1.5s ease-in-out infinite;
        }
      }
      @keyframes boot-pulse {
        50% {
          opacity: 0.5;
        }
      }
    </style>
  </head>
  <body>
    <app-root>
      <div class="boot" aria-busy="true">
        <p class="boot-header">Cargando el panel…</p>
        <div class="boot-row"></div>
        <div class="boot-row"></div>
        <div class="boot-row"></div>
        <div class="boot-row"></div>
      </div>
    </app-root>
  </body>
</html>
